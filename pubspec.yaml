name: vsdroid
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  android_intent_plus: ^5.3.0
  bloc: ^9.0.0
  ffi: ^2.1.4
  file_icon: ^1.0.0
  file_picker: ^10.2.0
  filesystem_picker: ^4.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_code_crafter: ^0.1.5
  flutter_highlight: ^0.7.0
  flutter_inappwebview: ^6.1.5
  flutter_json: ^0.0.4
  flutter_pty: ^0.4.1
  flutter_svg: ^2.2.0
  flutter_switch: ^0.3.2
  font_awesome_flutter: ^10.8.0
  highlight: ^0.7.0
  http: ^1.2.2
  path: ^1.9.0
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  xterm: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/material_icons/
    - assets/webview/
    - assets/fonts/
  fonts:
    - family: firaCode
      fonts:
        - asset: assets/fonts/FiraCode-Medium.ttf
    - family: cascadia
      fonts:
        - asset: assets/fonts/CascadiaCodePL-Regular.ttf
    - family: hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
    - family: dejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
    - family: inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata-Regular.ttf
    - family: jetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
    - family: proggy
      fonts:
        - asset: assets/fonts/ProggyVector-Regular.ttf
    - family: sourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Medium.ttf
