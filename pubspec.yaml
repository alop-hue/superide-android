name: vsdroid
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  android_intent_plus: ^5.2.1
  bloc: ^8.1.4
  ffi: ^2.1.3
  file_icon: ^1.0.0
  file_picker: ^8.1.6
  file_tree_view: ^0.0.3
  filesystem_picker: ^4.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_code_editor: ^0.3.2
  flutter_highlight: ^0.7.0
  flutter_inappwebview: ^6.1.5
  flutter_json: ^0.0.4
  flutter_pty: ^0.4.1
  flutter_svg: ^2.0.16
  font_awesome_flutter: ^10.8.0
  highlight: ^0.7.0
  http: ^1.2.2
  path: ^1.9.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  xterm: ^4.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/material_icons/
    - assets/webview/
    - assets/fonts/
  fonts:
    - family: firaCode
      fonts:
        - asset: assets/fonts/FiraCode-Medium.ttf
    - family: cascadia
      fonts:
        - asset: assets/fonts/CascadiaCodePL-Regular.ttf
    - family: hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
    - family: dejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
    - family: inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata-Regular.ttf
    - family: jetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
    - family: proggy
      fonts:
        - asset: assets/fonts/ProggyVector-Regular.ttf
    - family: sourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Medium.ttf
